[tool.poetry]
name = "tap-airbase"
version = "0.1.0"
description = "`tap-airbase` is a Singer tap for Airbase, built with the Hotglue Singer SDK."
authors = ["Hotglue"]
keywords = [
    "ELT",
    "Hotglue",
]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = "<3.11,>=3.7.1"
requests = "^2.25.1"
hotglue-singer-sdk = "^1.0.3"
typing-extensions = "^4.0.0"

[tool.poetry.dev-dependencies]
pytest = "^6.2.5"
tox = "^3.24.4"
flake8 = "^3.9.2"
black = "^21.9b0"
pydocstyle = "^6.1.1"
mypy = "^0.910"
types-requests = "^2.26.1"
isort = "^5.10.1"

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = "tap_airbase"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tap-airbase = 'tap_airbase.tap:TapAirbase.cli'
